name: CI

on:
  # A bare `push:` also fires for a PR's branch, running CI twice per PR; a PR's
  # pushes are covered by `pull_request`.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"
  RUSTFLAGS: "-Dwarnings"

jobs:
  clippy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse MSRV
        run: sed -n 's/^rust-version = "\(.*\)"$/RUSTUP_TOOLCHAIN=\1/p' enclaver/Cargo.toml >> $GITHUB_ENV
      - name: Install Rust Toolchain
        run: rustup toolchain install $RUSTUP_TOOLCHAIN
      - name: Install Clippy and Rustfmt
        run: rustup component add clippy rustfmt

      - name: Check with default features
        run: |
          cargo clippy --quiet --no-deps --manifest-path enclaver/Cargo.toml

      - name: Check all binaries
        run: |
          cargo clippy --quiet --no-deps --manifest-path enclaver/Cargo.toml --features=run_enclave,odyn

      - name: Check with tracing enabled
        env:
          RUSTFLAGS: "--cfg=tokio_unstable"
        run: |
          cargo clippy --quiet --no-deps --manifest-path enclaver/Cargo.toml --features=run_enclave,odyn,tracing

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse MSRV
        run: sed -n 's/^rust-version = "\(.*\)"$/RUSTUP_TOOLCHAIN=\1/p' enclaver/Cargo.toml >> "$GITHUB_ENV"
      - name: Install Rust Toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN"

      # The skipped tests open AF_VSOCK sockets, which a container refuses
      # with EPERM.
      - name: Test all binaries
        run: >-
          cargo test --locked --manifest-path enclaver/Cargo.toml --features=run_enclave,odyn --
          --skip proxy::egress_http::tests::test_http_proxy
          --skip proxy::egress_http::tests::test_https_proxy
          --skip proxy::ingress::tests::test_enclave_proxy
          --skip proxy::ingress::tests::test_full_proxy
          --skip console::tests::test_app_status
